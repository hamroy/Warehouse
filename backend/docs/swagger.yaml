openapi: 3.0.3

info:
  title: Warehouse Management System API
  description: REST API untuk manajemen item, lokasi, dan stok warehouse.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Items
  - name: Stock

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/items:
    post:
      tags: [Items]
      summary: Create a new item
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreateRequest"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
    get:
      tags: [Items]
      summary: List items
      operationId: listItems
      parameters:
        - name: search
          in: query
          description: Search by SKU or name
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: page
          in: query
          description: Page number (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page (default 10, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: List of items with pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/items/{id}:
    get:
      tags: [Items]
      summary: Get item by ID
      operationId: getItemById
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags: [Items]
      summary: Update an item
      operationId: updateItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdateRequest"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
    delete:
      tags: [Items]
      summary: Soft delete an item
      operationId: deleteItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item soft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/stock/receive:
    post:
      tags: [Stock]
      summary: Receive stock into a location
      operationId: receiveStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockRequest"
      responses:
        "200":
          description: Stock received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/stock/{item_id}:
    get:
      tags: [Stock]
      summary: Get stock for an item across all locations
      operationId: getStockByItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Stock details per location with total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockListResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

components:
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      description: Item UUID
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: Conflict (e.g. duplicate SKU)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    ItemCreateRequest:
      type: object
      required: [sku, name, category, unit]
      properties:
        sku:
          type: string
          example: SKU-001
        name:
          type: string
          example: Laptop Dell
        category:
          type: string
          example: Electronics
        unit:
          type: string
          example: PCS

    ItemUpdateRequest:
      type: object
      required: [sku, name, category, unit]
      properties:
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        unit:
          type: string

    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    ItemResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/Item"

    ItemListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    ReceiveStockRequest:
      type: object
      required: [item_id, location_id, qty]
      properties:
        item_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
          example: 100

    Stock:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        qty:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StockResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/Stock"

    StockDetail:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
        item_sku:
          type: string
        item_name:
          type: string
        location_id:
          type: string
          format: uuid
        location_code:
          type: string
        qty:
          type: integer

    StockListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            total:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/StockDetail"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
